services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-todo-web:latest
    environment:
      DB__URL: postgresql+asyncpg://user:password@pg:5432/ai_todo
      REDIS__HOST: redis
      GROQ_API: "https://api.example.com"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      - pg
      - redis

  pg:
    image: postgres
    environment:
      POSTGRES_DB: ai_todo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  adminer:
    image: adminer
    ports:
      - "8080:8080"
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"

volumes:
  redis_data:
